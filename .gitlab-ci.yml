# Bake this repo's schema variant of libexificient on GitLab.
#
# Designed for DOCKER-EXECUTOR runners: the job runs inside the library's
# hermetic builder image (no podman-in-docker nesting). Shell-executor runners
# with podman can instead run the library's bake.sh directly — see the README.
#
# Everything is overridable per-project via CI/CD variables (no file edits
# needed — important when this repo is consumed as a nightly-synced mirror):
#   LIBRARY_REPO_URL   where to clone the library (same-instance URLs are
#                      cloned with CI_JOB_TOKEN; the target project must
#                      allowlist this project for job-token access)
#   LIBRARY_REF        library tag/branch (default v1.0.2)
#   SCHEMA_PATH        xsd within THIS repo (imports staged from its directory)
#   SCHEMA_ID          baked schema slug
#   BAKE_BUILDER_IMAGE builder image (match your runner's architecture)
#   BAKE_VERSION       library version stamped on artifacts
#   CONAN_PUBLISH      "true" to publish to this project's Conan registry
#   BAKE_WINDOWS_RUNNER_TAG  runner tag for the manual bake-windows job below
#                      (empty = job stays effectively unassignable; set to a
#                      real tag, e.g. "win-amd64", once such a runner exists)
variables:
  LIBRARY_REPO_URL: "https://github.com/M4lwar/exificient-native-image.git"
  LIBRARY_REF: "v1.0.2"
  SCHEMA_PATH: "schemas/A-GRA_MessageDefinitions_v5_0_a.xsd"
  SCHEMA_ID: "agra-5.0"
  BAKE_BUILDER_IMAGE: "ghcr.io/m4lwar/exificient-builder:1.0.0-x86_64"
  BAKE_VERSION: "1.0.2"
  BAKE_RUNNER_TAG: ""          # set to a runner tag to steer the job (empty = untagged runners)
  CONAN_PUBLISH: "true"
  BAKE_WINDOWS_RUNNER_TAG: ""  # set to a windows instance-executor runner tag to enable bake-windows

bake:
  stage: build
  tags:
    - $BAKE_RUNNER_TAG
  image:
    name: $BAKE_BUILDER_IMAGE
    entrypoint: [""]
  script:
    # --- trust the instance CA for same-instance operations, when provided ---
    - |
      # Trust the instance CA only if it actually validates (runner fleets can
      # carry stale CA files); otherwise same-instance TLS is unverified and
      # the Conan remote is marked insecure.
      GIT_OPTS="-c http.sslVerify=false"
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ] && [ -f "${CI_SERVER_TLS_CA_FILE}" ]; then
        if git -c http.sslCAInfo="${CI_SERVER_TLS_CA_FILE}" ls-remote "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD >/dev/null 2>&1; then
          GIT_OPTS="-c http.sslCAInfo=${CI_SERVER_TLS_CA_FILE}"
        else
          echo "WARNING: runner CA failed live validation; same-instance git TLS unverified"
        fi
      fi
      # The Conan registry remote is always added --insecure for same-instance
      # use: python's TLS needs the ROOT CA in the trust file, and runner CA
      # files commonly carry only leaf+intermediate (git tolerates that, python
      # does not). Once the runners' tls-ca-file includes the root CA, this can
      # return to verified TLS.
      CONAN_REMOTE_OPTS="--insecure"
    # --- clone the library (job-token auth for same-instance mirrors) ---
    - |
      CLONE_URL="$LIBRARY_REPO_URL"
      case "$CLONE_URL" in
        https://${CI_SERVER_HOST}/*)
          CLONE_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CLONE_URL#https://}" ;;
      esac
      git $GIT_OPTS clone --depth 1 --branch "$LIBRARY_REF" "$CLONE_URL" /src
    # --- stage THIS repo's schemas (imports included) and bake offline ---
    - cp "$(dirname "$SCHEMA_PATH")"/*.xsd /src/schemas/
    - mkdir -p /out
    - sh /src/ci/bake-inner.sh --schema "$SCHEMA_PATH" --id "$SCHEMA_ID" --version "$BAKE_VERSION"
    - mkdir -p bake-out && cp /out/* bake-out/
    # --- publish to this project's Conan package registry ---
    - |
      if [ "$CONAN_PUBLISH" = "true" ] && command -v conan >/dev/null 2>&1; then
        conan remote add gitlab "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/conan" --force ${CONAN_REMOTE_OPTS}
        conan cache restore bake-out/conan-exificient-*.tgz
        conan remote login gitlab ci_user -p "${CI_JOB_TOKEN}"
        conan upload "exificient/*" -r gitlab --confirm
      fi
  artifacts:
    paths: [bake-out/]

# One-off Windows bake: manual button; needs a runner tagged
# $BAKE_WINDOWS_RUNNER_TAG (GitLab instance executor over SSH into a
# spot Windows host whose AMI already carries the whole toolchain — git,
# GraalVM, Maven, Conan, VS Build Tools — plus the origin CA in the machine
# trust store). Runs bake-windows.ps1 from the library clone directly on the
# host (no container: Windows native-image can't run inside a Linux
# container, same reasoning as the GitHub Actions bake-windows job).
# Publishes to this project's Conan registry, same as the `bake` job above.
bake-windows:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: manual
      allow_failure: true
  tags:
    - $BAKE_WINDOWS_RUNNER_TAG
  variables:
    # Ephemeral, freshly-booted instance each run -- no cached workspace to
    # fetch into, so force a full clone of THIS repo (needed for schemas/).
    GIT_STRATEGY: clone
  script:
    # --- clone the library into a dir relative to the job's working
    #     directory ($CI_PROJECT_DIR on the instance executor) -- simpler
    #     cleanup than an absolute C:\ path and no New-Item -Force needed.
    #     Same-instance URLs need job-token auth exactly like the Linux
    #     job above; this mirrors its bash case/rewrite logic in PowerShell. ---
    - |
      $CloneUrl = $env:LIBRARY_REPO_URL
      if ($CloneUrl.StartsWith("https://$($env:CI_SERVER_HOST)/")) {
        $CloneUrl = $CloneUrl -replace '^https://', "https://gitlab-ci-token:$($env:CI_JOB_TOKEN)@"
      }
      git clone --depth 1 --branch "$env:LIBRARY_REF" $CloneUrl lib
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # --- stage THIS repo's schemas (imports included) into the library
    #     clone. SCHEMA_PATH is forward-slash ("schemas/x.xsd"); Split-Path
    #     handles that fine on Windows -- .NET treats '/' as a valid
    #     separator there too, same as '\'. ---
    - New-Item -ItemType Directory -Force -Path lib\schemas | Out-Null
    - Copy-Item "$(Split-Path $env:SCHEMA_PATH)\*.xsd" lib\schemas\
    # --- bake (bake-windows.ps1 lives at the library clone's root). The
    #     runner's shell is Windows PowerShell 5.1 (instance executor,
    #     `shell = "powershell"`) -- the AMI carries no PowerShell Core, so
    #     this calls bake-windows.ps1 directly rather than via a "pwsh" exe
    #     that doesn't exist on the host. A bare "lib\bake-windows.ps1" (no
    #     leading .\) fails to resolve as a script path in PowerShell (it's
    #     parsed as a module-name lookup instead) -- the ".\" prefix below is
    #     required, not stylistic. The AMI imports the origin CA into
    #     LocalMachine\Root at bake time, so every TLS operation below is
    #     fully verified -- UNLIKE the Linux `bake` job above, which falls
    #     back to --insecure / http.sslVerify=false because its runner CA
    #     bundle carries no root cert. No --insecure flags in this job;
    #     that asymmetry is intentional. NOTE: verified TLS assumes the
    #     instance reaches the GitLab origin directly (sites whose public DNS
    #     is CDN-proxied need a hosts pin, e.g. via the runner's
    #     pre_get_sources_script) -- the origin CA in the cert store is
    #     useless against a CDN edge certificate. ---
    - .\lib\bake-windows.ps1 -Schema "$env:SCHEMA_PATH" -Id "$env:SCHEMA_ID" -Version "$env:BAKE_VERSION" -Out bake-out
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # --- publish to this project's Conan package registry (verified TLS).
    #     conan is python and never reads the Windows cert store; when the
    #     AMI ships a site trust anchor (build-ami.sh leaves it at
    #     C:\tools\site-origin-root.pem), point conan's cacert at it so the
    #     upload verifies. Absent that file this is a no-op. ---
    - |
      if (Test-Path 'C:\tools\site-origin-root.pem') {
        $ConanHome = (conan config home | Out-String).Trim()
        New-Item -ItemType Directory -Force -Path $ConanHome | Out-Null
        Add-Content -Path (Join-Path $ConanHome 'global.conf') -Value 'core.net.http:cacert_path = C:/tools/site-origin-root.pem'
      }
    - conan remote add gitlab "https://$env:CI_SERVER_HOST/api/v4/projects/$env:CI_PROJECT_ID/packages/conan" --force
    - conan cache restore (Get-Item "bake-out\conan-*windows*.tgz").FullName
    - conan remote login gitlab ci_user -p "$env:CI_JOB_TOKEN"
    - conan upload "exificient/*" -r gitlab --confirm
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    paths: [bake-out/]
